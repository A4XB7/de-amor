<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mom Recovery — Admin</title><style>body{font-family:Arial,sans-serif;background:#0066cc;margin:0;min-height:100vh;display:grid;place-items:center}.box{background:#fff;padding:30px;border-radius:22px;width:min(92%,520px);box-shadow:0 20px 50px #003b7a55}h1{margin-top:0}input,button{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}button{background:#0052a3;color:white;border:0;font-weight:bold;cursor:pointer}.status{margin-top:15px;padding:12px;border-radius:10px;background:#eef7ff}.small{font-size:.9rem;color:#555;line-height:1.5}a{color:#0052a3;font-weight:bold}</style></head><body><main class="box"><h1>🎵 Song Admin</h1><p>Select the audio you want Mom's recovery page to play.</p><input id="song" type="file" accept="audio/*"><button id="save">Save Song</button><button id="clear">Remove Saved Song</button><div id="status" class="status">Checking saved song…</div><p class="small"><b>Important:</b> the song is saved in this browser on this device. It is not uploaded to the public server.</p><p><a href="../">← Back to Mom's page</a></p></main><script>const DB='momRecoverySong',STORE='audio';const status=document.getElementById('status');function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function saveSong(file){const db=await openDB();await new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(file,'song');t.oncomplete=resolve;t.onerror=()=>reject(t.error)});db.close()}async function getSong(){const db=await openDB();const value=await new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readonly');const r=t.objectStore(STORE).get('song');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();return value}async function clearSong(){const db=await openDB();await new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete('song');t.oncomplete=resolve;t.onerror=()=>reject(t.error)});db.close()}document.getElementById('save').onclick=async()=>{const file=document.getElementById('song').files[0];if(!file){status.textContent='Please choose an audio file first.';return}try{await saveSong(file);status.textContent='✅ Saved: '+file.name}catch(e){status.textContent='Could not save the song in this browser.'}};document.getElementById('clear').onclick=async()=>{try{await clearSong();status.textContent='Song removed.'}catch(e){status.textContent='Could not remove the song.'}};getSong().then(file=>{status.textContent=file?'🎵 Saved song: '+file.name:'No song saved yet.'}).catch(()=>{status.textContent='Your browser could not open song storage.'});</script></body></html>
