<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mom Recovery — Admin</title><style>body{font-family:Arial,sans-serif;background:#0066cc;margin:0;min-height:100vh;display:grid;place-items:center}.box{background:#fff;padding:30px;border-radius:22px;width:min(92%,520px);box-shadow:0 20px 50px #003b7a55}h1{margin-top:0}input,button{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}button{background:#0052a3;color:white;border:0;font-weight:bold;cursor:pointer}.status{margin-top:15px;padding:12px;border-radius:10px;background:#eef7ff}.small{font-size:.9rem;color:#555;line-height:1.5}</style></head><body><main class="box"><h1>🎵 Song Admin</h1><p>Choose the song you want the recovery page to play on this device.</p><input id="song" type="file" accept="audio/*"><button id="save">Save Song</button><button id="clear">Remove Saved Song</button><div id="status" class="status">No song selected.</div><p class="small"><b>Note:</b> this admin stores the selected audio in this browser on this device. It does not upload the audio to the public server.</p><p><a href="index.html">← Back to Mom's page</a></p></main><script>const DB='momRecoverySong',STORE='audio';function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function put(file){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(file,'song');t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function get(){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly');const r=t.objectStore(STORE).get('song');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function remove(){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete('song');t.oncomplete=res;t.onerror=()=>rej(t.error)})}const status=document.getElementById('status');document.getElementById('save').onclick=async()=>{const f=document.getElementById('song').files[0];if(!f){status.textContent='Please choose an audio file first.';return}await put(f);status.textContent='✅ Song saved: '+f.name};document.getElementById('clear').onclick=async()=>{await remove();status.textContent='Song removed.'};get().then(f=>{if(f)status.textContent='🎵 Saved song: '+f.name}).catch(()=>{});</script></body></html>
